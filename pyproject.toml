[project]
name = "wav2sum"
version = "0.4.0"
description = "Audio → speaker-labelled transcript → summary (local, MPS/CUDA)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    "transformers>=4.40.0,<5.0.0",
    "sentencepiece>=0.2.0",
    "pyannote-audio>=3.1.0",
    "ollama>=0.4.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "silero-vad>=5.1",
    "numpy>=2.2.6",
    "scipy>=1.15.3",
    "textual>=3",
]

[project.scripts]
wav2sum = "wav2sum.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PL"]
ignore = ["PLC0415", "PLR0911", "PLR0913", "PLR2004", "RUF001", "RUF002", "RUF003"]
