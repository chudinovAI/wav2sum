[project]
name = "wav2sum"
version = "0.2.0"
description = "Аудио → транскрипт со спикерами → саммари (локально, MPS/CUDA)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    "transformers>=4.40.0,<5.0.0",
    "sentencepiece>=0.2.0",
    "pyannote-audio>=3.1.0",
    "ollama>=0.4.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
]

[project.scripts]
wav2sum = "wav2sum.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
