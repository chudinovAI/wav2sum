[project]
name = "wav2sum"
version = "0.4.0"
description = "Audio → speaker-labelled transcript → summary (local, MPS/CUDA)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    "transformers>=5.0.0",
    "sentencepiece>=0.2.0",
    "pyannote-audio>=3.1.0",
    "mlx-lm>=0.32.2",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "silero-vad>=5.1",
    "numpy>=2.2.6",
    "scipy>=1.15.3",
    "textual>=3",
    "speechbrain>=1.0",
    "parakeet-mlx>=0.5",
]

[project.scripts]
wav2sum = "wav2sum.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.9",
]
coreml = [
    "coremltools>=9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
timeout = 120

[tool.coverage.run]
source = ["wav2sum"]

[tool.coverage.report]
skip_covered = true
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PL"]
ignore = ["PLC0415", "PLR0911", "PLR0913", "PLR2004", "RUF001", "RUF002", "RUF003"]
