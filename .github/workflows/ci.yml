name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --only-group dev
      - run: uv run --no-sync ruff check --output-format=github
      - run: uv run --no-sync ruff format --check

  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Test
        run: uv run pytest --cov --cov-report=term --cov-report=markdown-append:"$GITHUB_STEP_SUMMARY" --durations=10
      - name: Typecheck Swift
        run: |
          swiftc -typecheck wav2sum/native/app/*.swift
          swiftc -typecheck wav2sum/native/capture.swift
          swiftc -typecheck wav2sum/native/app/Logo.swift wav2sum/native/icon/main.swift
